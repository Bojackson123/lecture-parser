[project]
name = "lecturenotes"
version = "0.0.1"
description = "Turn a week of lecture videos, slides and captions into structured study notes."
readme = "README.md"
requires-python = ">=3.12"
# Pillow is not listed: pypdf's image decoding (P2-03) needs it, and it arrives at
# runtime as a dependency of python-pptx.
dependencies = ["pydantic>=2", "python-pptx>=1.0", "pypdf>=6", "anthropic>=1"]

[project.scripts]
lecturenotes = "lecturenotes.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "hypothesis",
    "httpx",  # fastapi.testclient's transport — test-only, never a runtime dep
]
fixtures = ["reportlab", "Pillow"]
# The web GUI's stack: a dependency group, not a runtime dependency (the P7-04
# doctrine: the pipeline itself needs no server). It sits in default-groups below
# so a plain `uv sync` keeps `lecturenotes serve` working instead of uninstalling
# it; `lecturenotes serve` without it prints an install hint and exits 2.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lecturenotes"]

# "dev" is uv's usual default; "web" is added so a plain `uv sync` never
# uninstalls the serve stack (this uv has no default-extras, hence a group).
[tool.uv]
default-groups = ["dev", "web"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["lecturenotes"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "lecturenotes"

[[tool.importlinter.contracts]]
name = "model imports nothing internal"
type = "forbidden"
source_modules = ["lecturenotes.model"]
forbidden_modules = [
    "lecturenotes.ingest",
    "lecturenotes.align",
    "lecturenotes.generate",
    "lecturenotes.render",
    "lecturenotes.emit",
    "lecturenotes.cli",
]

[[tool.importlinter.contracts]]
name = "render never imports the left half"
type = "forbidden"
source_modules = ["lecturenotes.render"]
forbidden_modules = [
    "lecturenotes.ingest",
    "lecturenotes.align",
    "lecturenotes.generate",
]

[[tool.importlinter.contracts]]
name = "emit never imports the left half"
type = "forbidden"
source_modules = ["lecturenotes.emit"]
forbidden_modules = [
    "lecturenotes.ingest",
    "lecturenotes.align",
    "lecturenotes.generate",
]

# Plan §2: "Neither half imports the other" — the mirror of the two contracts above.
[[tool.importlinter.contracts]]
name = "the left half never imports render or emit"
type = "forbidden"
source_modules = [
    "lecturenotes.ingest",
    "lecturenotes.align",
    "lecturenotes.generate",
]
forbidden_modules = ["lecturenotes.render", "lecturenotes.emit"]

# Side-track W: `web`, like `cli`, is an unconstrained composer — it imports both
# halves, which is its job. Nothing in the pipeline may import it back. `cli` is
# deliberately excluded (cmd_serve lazily imports web); `pairing` is included so the
# helper shared by both frontends can never grow a web import.
[[tool.importlinter.contracts]]
name = "nothing in the pipeline imports the web layer"
type = "forbidden"
source_modules = [
    "lecturenotes.model",
    "lecturenotes.ingest",
    "lecturenotes.align",
    "lecturenotes.generate",
    "lecturenotes.render",
    "lecturenotes.emit",
    "lecturenotes.pairing",
]
forbidden_modules = ["lecturenotes.web"]
